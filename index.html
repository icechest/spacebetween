<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Between The Lines</title>
    <style>
        :root {
            --text-primary: #f0f6fc;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Replace 'image_KTZWNC.png' with your actual image path or filename */
            background-image: url('betweenlines.jpg');
            background-color: #030303;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            /* Prevents unwanted elastic scrolling behaviors on iOS mobile devices */
            position: relative;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 650px;
            /* Uses fluid viewport padding for better breathing room on small screens */
            padding: 40px 6vw;
            text-align: center;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .text-block {
            /* Responsive font sizing using clamp to scale cleanly between mobile and desktop */
            font-size: clamp(1rem, 4vw, 1.25rem);
            line-height: 1.7;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 0.8);
            transition: color 0.6s ease;
        }

        /* The Void / Responsive interactive middle gap */
        .the-gap {
            /* Slightly shorter height on mobile screens to fit within smaller viewports */
            height: clamp(120px, 20vh, 180px);
            margin: 15px 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Removes the default gray touch highlight box on mobile webkit browsers */
            -webkit-tap-highlight-color: transparent;
        }

        .the-gap::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 75%);
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: scale(0.8);
        }

        /* Ambient boundary lines */
        .gap-line {
            position: absolute;
            left: 15%;
            width: 70%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.4), transparent);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gap-line.top { top: 0; }
        .gap-line.bottom { bottom: 0; }

        /* Typography inside the gap */
        .gap-insight {
            font-size: clamp(0.75rem, 3vw, 0.85rem);
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            /* Slightly higher baseline visibility on touch screens where hover states are absent */
            opacity: 0.3;
            transform: scale(0.95);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }

        /* Desktop Hover Styles & Mobile Active/Touch States */
        .the-gap:hover::before,
        .the-gap:active::before {
            opacity: 1;
            transform: scale(1.1);
        }

        .the-gap:hover .gap-line,
        .the-gap:active .gap-line {
            width: 100%;
            left: 0;
            background: linear-gradient(90deg, transparent, #00f2fe, transparent);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.8);
        }

        .the-gap:hover .gap-insight,
        .the-gap:active .gap-insight {
            opacity: 1;
            transform: scale(1.05);
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.9), 0 0 5px #00f2fe;
        }

        /* Media query specifically targeting mobile to tweak background attachment performance issues on iOS */
        @media (max-width: 768px) {
            body {
                /* Fixes a common mobile bug where background-attachment: fixed causes lag and layout clipping */
                background-attachment: scroll;
            }
            .gap-line {
                left: 10%;
                width: 80%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="text-block">
            True clarity does not always sit directly within the written words. 
            The most profound truths remain hidden, quietly waiting in the margins.
        </p>

        <div class="the-gap">
            <div class="gap-line top"></div>
            <span class="gap-insight">Read Between the Lines</span>
            <div class="gap-line bottom"></div>
        </div>

        <p class="text-block">
            By embracing the deliberate absence of sound, content, and distractions, 
            we find meaning inside the negative space.
        </p>
    </div>

</body>
</html>
