<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Between The Lines</title>
    <style>
        :root {
            --bg-color: #0a0c10;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --line-color: rgba(240, 246, 242, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Abstract structural background lines */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 40px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        .text-block {
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            transition: color 0.5s ease;
        }

        /* The Void / The intentional gap concept */
        .the-gap {
            height: 160px;
            margin: 20px 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            group;
        }

        .the-gap::before {
            content: '';
            position: absolute;
            width: 120%;
            height: 100%;
            background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%);
            opacity: 0.3;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: scale(0.9);
        }

        /* Ambient glowing boundary lines */
        .gap-line {
            position: absolute;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--text-secondary), transparent);
            opacity: 0.2;
            transition: all 0.5s ease;
        }

        .gap-line.top { top: 0; }
        .gap-line.bottom { bottom: 0; }

        /* Interactive Hover Effects */
        .the-gap:hover::before {
            opacity: 1;
            transform: scale(1.05);
        }

        .the-gap:hover .gap-line {
            width: 100%;
            left: 0;
            opacity: 0.7;
            background: linear-gradient(90deg, transparent, #00f2fe, #4facfe, transparent);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .the-gap:hover + .bottom-text {
            color: var(--text-primary);
        }

        .gap-insight {
            font-size: 0.85rem;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .the-gap:hover .gap-insight {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-lines"></div>

    <div class="container">
        <p class="text-block">
            True clarity does not always sit directly within the written words. 
            The most profound truths remain hidden, quietly waiting in the margins.
        </p>

        <div class="the-gap">
            <div class="gap-line top"></div>
            <span class="gap-insight">Read Between the Lines</span>
            <div class="gap-line bottom"></div>
        </div>

        <p class="text-block bottom-text">
            By embracing the deliberate absence of sound, content, and distractions, 
            we find meaning inside the negative space.
        </p>
    </div>

</body>
</html>
